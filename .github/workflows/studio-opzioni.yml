# studio-opzioni.yml - STUDIO: vendere opzioni sull'S&P 500 (indici CBOE BXM e PUT) contro tenere l'indice.
# Si avvia a mano; risultato nel log e nell'artifact. Chiave solo dai Secrets.
name: Studio opzioni
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Studio
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: python studi/studio_opzioni.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opzioni
          path: studio_out/
