# studio-delistate.yml - DATI PER IL BACKTEST ONESTO (punto 4): storico MENSILE di TUTTE le azioni USA quotate E delistate
# (NYSE, NASDAQ, NYSE MKT/AMEX; solo "Common Stock"), da EODHD. Serve a ricostruire ogni mese l'universo delle aziende
# grandi e liquide COM'ERA in quel momento (anche quelle poi fallite o comprate), invece dei soli titoli di oggi.
# Per ogni azione: [mese, prezzo rettificato, controvalore scambiato nel mese = chiusura x volume].
# Risultato: ramo "studio-delistate" (elenchi + file mensili compressi). Solo studio offline: il sito non cambia.
# Chiave EODHD solo dai Secrets: mai nei log. Si lancia a mano (Actions -> Studio delistate -> Run workflow).
name: Studio delistate
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Scarica lo storico mensile da EODHD
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: |
          mkdir out && cd out
          python3 -u - <<'PY'
          import gzip, json, os, threading, time, urllib.error, urllib.parse, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          KEY = os.environ["EODHD_API_KEY"]
          BORSE = ("NYSE", "NASDAQ", "NYSE MKT", "AMEX", "NYSE ARCA", "BATS")
          lock, cont = threading.Lock(), {"n": 0, "err": 0}
          def get(path, q=None):
              url = "https://eodhd.com/api/" + path + "?" + urllib.parse.urlencode(dict(q or {}, api_token=KEY, fmt="json"))
              for n in range(3):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "cot-radar/studio-delistate"})
                      with urllib.request.urlopen(req, timeout=90) as r:
                          js = json.load(r)
                      with lock:
                          cont["n"] += 1
                      time.sleep(0.3)                      # 4 in parallelo x 0,3 s = ~800 richieste al minuto (limite 1.000)
                      return js
                  except urllib.error.HTTPError as e:
                      if e.code == 404:
                          return None
                      time.sleep(5 * (n + 1))
                  except Exception:
                      time.sleep(5 * (n + 1))
              with lock:
                  cont["err"] += 1
              return None
          # 1) elenchi: quotate oggi + delistate (solo azioni ordinarie delle borse principali)
          el = {}
          for extra, stato in (({}, "quotata"), ({"delisted": 1}, "delistata")):
              for x in get("exchange-symbol-list/US", extra) or []:
                  if x.get("Type") == "Common Stock" and (x.get("Exchange") or "").upper() in BORSE:
                      el.setdefault(x["Code"], {"n": x.get("Name"), "b": x.get("Exchange"), "isin": x.get("Isin"), "stato": stato})
          print("azioni in elenco:", len(el), "di cui delistate:", sum(1 for v in el.values() if v["stato"] == "delistata"))
          json.dump(el, open("elenco.json", "w"), ensure_ascii=False)
          # 2) storico mensile di ognuna (dal 1995): [mese, prezzo rettificato, controvalore del mese]
          def mese(code):
              js = get(f"eod/{code}.US", {"period": "m", "from": "1995-01-01"})
              out = []
              for x in js or []:
                  c, a, v = x.get("close"), x.get("adjusted_close"), x.get("volume")
                  if x.get("date") and a and a > 0 and c and v is not None:
                      out.append([x["date"][:7], round(float(a), 4), round(float(c) * float(v))])
              return code, out
          dati, t0 = {}, time.time()
          with ThreadPoolExecutor(4) as ex:
              for i, (code, out) in enumerate(ex.map(mese, sorted(el))):
                  if out:
                      dati[code] = out
                  if i % 1000 == 0:
                      print(i, "/", len(el), "con dati:", len(dati), "chiamate:", cont["n"], "errori:", cont["err"],
                            "minuti:", round((time.time() - t0) / 60, 1))
          # 3) file compressi divisi per iniziale (ognuno ben sotto i limiti di GitHub)
          gruppi = {}
          for code, out in dati.items():
              gruppi.setdefault(code[0].upper() if code[0].isalpha() else "0", {})[code] = out
          for g, d in gruppi.items():
              with gzip.open(f"mensile_{g}.json.gz", "wt") as f:
                  json.dump(d, f, separators=(",", ":"))
          json.dump({"quando": time.strftime("%Y-%m-%d %H:%M UTC", time.gmtime()), "azioni": len(el), "con_dati": len(dati),
                     "chiamate": cont["n"], "errori": cont["err"]}, open("riepilogo.json", "w"))
          print("fatto:", len(dati), "serie; chiamate", cont["n"], "errori", cont["err"])
          PY
      - name: Salva nel ramo "studio-delistate"
        run: |
          cd out
          git init -q -b studio-delistate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "storico mensile azioni USA quotate e delistate: $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" studio-delistate:studio-delistate
