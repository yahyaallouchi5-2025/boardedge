# prezzi-live.yml - v7.1 PREZZI INTRADAY per i Portafogli (cot_radar/live.py, fonte EODHD real-time, ritardo ~15 min).
# Ogni 15 minuti nei giorni feriali dalle 07 alle 21 UTC (Xetra 08-16:30 UTC, Wall Street 14:30-21 UTC): scrive
# live.json nel ramo "live" (UN solo commit, riscritto: niente storia). La pagina lo rilegge ogni minuto.
# GitHub puo' ritardare le corse programmate di qualche minuto: la pagina mostra sempre l'orario dei prezzi.
# Chiave EODHD solo dai Secrets. A mano: Actions -> Prezzi live -> Run workflow.
name: Prezzi live
on:
  schedule:
    - cron: "*/15 7-21 * * 1-5"
    - cron: "*/15 23 * * 0-4"
    - cron: "*/15 0-5 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prezzi-live
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Prezzi intraday da EODHD
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: |
          # live.json del giro prima (solo per riusare i simboli gia' trovati: meno richieste)
          curl -sf -m 20 -o prima.json "https://raw.githubusercontent.com/${{ github.repository }}/live/live.json" || true
          python3 -m cot_radar.live out prima.json
      - name: Salva nel ramo "live" (un solo commit, sovrascritto)
        run: |
          cd out
          git init -q -b live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "prezzi live: $(date -u +%F' '%H:%M)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" live:live
