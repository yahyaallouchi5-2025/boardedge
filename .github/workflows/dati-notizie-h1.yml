# dati-notizie-h1.yml - CANDELE ORARIE dei giorni di notizia USA (CPI, NFP, Fed) dal 2016, per lo studio
# "le 4 ore dopo la notizia" (tools/studio_notizie_4h.py). Scrive solo nel ramo "dati-notizie-h1".
# Fonte: archivio storico pubblico di Dukascopy (candele orarie BID, un file per giorno e coppia, formato .bi5 = LZMA).
# Si scaricano SOLO i giorni di notizia (~600 giorni x 8 strumenti), con una pausa tra le richieste.
# Date delle notizie: ramo "dati-notizie" (workflow dati-notizie.yml). Parte da solo quando si crea/modifica questo file.
name: Dati notizie H1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/dati-notizie-h1.yml']
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Scarica le candele orarie dei giorni di notizia
        run: |
          mkdir out && cd out
          python3 - <<'PY'
          import csv, io, lzma, struct, time, urllib.request
          from datetime import datetime, timezone
          RAW = "https://raw.githubusercontent.com/${{ github.repository }}/dati-notizie/"
          # strumento -> divisore del prezzo nei file Dukascopy (coppie con lo yen e oro: 3 decimali)
          STRUMENTI = {"EURUSD": 1e5, "GBPUSD": 1e5, "AUDUSD": 1e5, "NZDUSD": 1e5, "USDJPY": 1e3,
                       "USDCHF": 1e5, "USDCAD": 1e5, "XAUUSD": 1e3}
          def get(url):
              for n in range(3):                               # 3 tentativi con attesa crescente
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "cot-radar/dati-notizie-h1"})
                      with urllib.request.urlopen(req, timeout=60) as r:
                          return r.read()
                  except Exception as e:
                      if getattr(e, "code", None) == 404:
                          return b""
                      time.sleep(3 * (n + 1))
              return None
          def date_evento(nome, lo, hi):
              righe = sorted(r["data"] for r in csv.DictReader(io.StringIO(get(RAW + nome + ".csv").decode())))
              if lo is None:
                  return sorted(set(righe))
              per_mese = {}
              for x in righe:                                  # una per mese: le altre date sono revisioni
                  if lo <= int(x[8:10]) <= hi and x[:7] not in per_mese:
                      per_mese[x[:7]] = x
              return sorted(per_mese.values())
          giorni = sorted(set(d for d in date_evento("cpi", 8, 20) + date_evento("nfp", 1, 12) + date_evento("fomc", None, None)
                              if d >= "2016-01-01"))
          print("giorni di notizia:", len(giorni))
          for s, div in STRUMENTI.items():
              n_ok = 0
              with open(f"h1_{s}.csv", "w", newline="") as f:
                  w = csv.writer(f); w.writerow(["ts", "o", "h", "l", "c"])
                  for d in giorni:
                      y, m, g = int(d[:4]), int(d[5:7]), int(d[8:10])
                      b = get(f"https://datafeed.dukascopy.com/datafeed/{s}/{y}/{m - 1:02d}/{g:02d}/BID_candles_hour_1.bi5")
                      time.sleep(0.4)
                      if not b:
                          continue
                      try:
                          raw = lzma.decompress(b)
                      except lzma.LZMAError:
                          continue
                      t0 = int(datetime(y, m, g, tzinfo=timezone.utc).timestamp())
                      for k in range(0, len(raw) - 23, 24):    # record: secondi, open, close, low, high (int), volume (float)
                          sec, o, c, lo_, hi_, vol = struct.unpack(">iiiiif", raw[k:k + 24])
                          w.writerow([t0 + sec, o / div, hi_ / div, lo_ / div, c / div])
                      n_ok += 1
              print(s, "giorni scaricati:", n_ok)
          PY
      - name: Salva nel ramo "dati-notizie-h1" (un solo commit, sovrascritto)
        run: |
          cd out
          git init -q -b dati-notizie-h1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "candele H1 notizie: $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dati-notizie-h1:dati-notizie-h1
