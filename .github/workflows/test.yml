# test.yml - a ogni modifica caricata su GitHub (push) o proposta (pull request) lancia i test.
# Se qualcosa si rompe, accanto alla modifica compare una X rossa: clicca per vedere quale test e' fallito.
name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]   # v7.24: il 3.9 non esiste piu sui server Ubuntu 26.04 di GitHub
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python main.py --demo --out demo   # la dashboard con dati finti deve crearsi senza errori
