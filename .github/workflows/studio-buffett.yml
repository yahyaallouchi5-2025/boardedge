name: Studio Buffett - bilanci SEC
# Scarica gli archivi trimestrali dei bilanci SEC (dal 2009) e li salva nel branch "studio-buffett". Solo studio.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scarica e compatta
        env:
          SEC_CONTATTO: ${{ secrets.SEC_CONTATTO }}
        run: python studi/sec_bilanci_storia.py studio_out
      - name: Salva nel branch studio-buffett
        run: |
          cd studio_out
          ls -la
          git init -q -b studio-buffett
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Bilanci SEC $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" studio-buffett
