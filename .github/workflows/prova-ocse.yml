# prova-ocse.yml - v7.21c PROVA DELLE FONTI per il quadro economico: anticipatore OCSE per l'Eurozona (paesi grandi),
# inflazione del Giappone dalla BIS, inflazione/disoccupazione/produzione dell'Eurozona dalla BCE, storia lunga del CLI.
# Risultato: ramo "prova-ocse", file ocse.json. Nessun cambio al sito. Si lancia a mano (Actions -> Prova OCSE).
name: Prova OCSE
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Interroga OCSE, BIS e BCE
        run: |
          mkdir out && cd out
          python3 -u - <<'PY'
          import csv, io, json, time, urllib.error, urllib.request
          def get(url):
              """(codice http, testo); nuovi tentativi se il server limita le richieste (429)."""
              for t in range(4):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "cot-radar/prova-ocse"})
                      with urllib.request.urlopen(req, timeout=120) as r:
                          return r.status, r.read().decode("utf-8", "replace")
                  except urllib.error.HTTPError as e:
                      if e.code == 429 and t < 3:
                          time.sleep(20 * (t + 1)); continue
                      return e.code, ""
                  except Exception as e:
                      if t < 3:
                          time.sleep(10); continue
                      return type(e).__name__, ""
          OCSE = "https://sdmx.oecd.org/public/rest/data/OECD.SDD.STES,DSD_STES@DF_CLI,4.1/"
          PROVE = {
              "cli_europa": OCSE + "DEU+FRA+ITA+ESP+NLD+EA20+G4E+EA19+OECDE.M.LI...AA...H?startPeriod=2025-06&format=csvfile",
              "cli_storia_usa": OCSE + "USA.M.LI...AA...H?startPeriod=1955-01&format=csvfile",
              "bis_cpi_jp_v1": "https://stats.bis.org/api/v1/data/WS_LONG_CPI/M.JP.771?startPeriod=2025-01&format=csv",
              "bis_cpi_jp_v2": "https://stats.bis.org/api/v2/data/dataflow/BIS/WS_LONG_CPI/1.0/M.JP.771?startPeriod=2025-01&format=csv",
              "bce_hicp": "https://data-api.ecb.europa.eu/service/data/ICP/M.U2.N.000000.4.ANR?startPeriod=2025-06&format=csvdata",
              "bce_disoccupazione": "https://data-api.ecb.europa.eu/service/data/LFSI/M.I9.S.UNEHRT.TOTAL0.15_74.T?startPeriod=2025-06&format=csvdata",
              "bce_produzione": "https://data-api.ecb.europa.eu/service/data/STS/M.I9.Y.PROD.NS0020.4.000?startPeriod=2025-06&format=csvdata",
          }
          out = {"quando": time.strftime("%Y-%m-%d %H:%M UTC", time.gmtime()), "prove": {}}
          for nome, url in PROVE.items():
              c, testo = get(url)
              righe = list(csv.DictReader(io.StringIO(testo))) if c == 200 else []
              area = lambda r: r.get("REF_AREA") or r.get("REF_AREA:Reference area") or ""
              per = {}
              for r in righe:
                  per.setdefault(area(r), []).append((r.get("TIME_PERIOD") or r.get("TIME_PERIOD:Time period or range") or "", r.get("OBS_VALUE") or r.get("OBS_VALUE:Observation Value") or ""))
              out["prove"][nome] = {"http": c, "righe": len(righe), "colonne": list(righe[0].keys())[:12] if righe else [],
                                    "aree": {a: {"n": len(v), "primo": min(v), "ultimi": sorted(v)[-3:]} for a, v in per.items()}}
              print(nome, c, len(righe))
              time.sleep(8)
          json.dump(out, open("ocse.json", "w"), ensure_ascii=False, indent=1)
          PY
      - name: Salva il risultato nel ramo prova-ocse
        run: |
          cd out
          git init -q -b prova-ocse
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add ocse.json && git commit -qm "prova OCSE"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" prova-ocse
